
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Video Meeting</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="join-container" id="joinUI">
  <h1>Video Meeting</h1>

  <input id="username" placeholder="Your Name">
  <input id="room" placeholder="Room Name">

  <button onclick="joinRoom()">Join Meeting</button>
</div>

<div id="meetingUI" class="hidden">

  <div class="topbar">
    <span id="roomLabel"></span>
    <button onclick="leaveRoom()">Leave</button>
  </div>

  <div id="videos"></div>

  <div class="controls">
    <button onclick="toggleMic()">Mic</button>
    <button onclick="toggleCamera()">Camera</button>
    <button onclick="shareScreen()">Share Screen</button>
  </div>

</div>

<script src="https://unpkg.com/livekit-client/dist/livekit-client.umd.js"></script>
<script src="app.js"></script>

</body>
</html>
