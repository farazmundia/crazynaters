<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LiveKit Audio Call</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/livekit-client/dist/livekit-client.umd.min.js"></script>
</head>
<body>
  <main class="page">
    <section class="call-card">
      <div class="header-row">
        <div>
          <h1>Audio Call</h1>
          <p>Simple LiveKit audio room for 2 or more users.</p>
        </div>
        <span id="connectionDot" class="dot"></span>
      </div>

      <div class="form-group">
        <label for="username">Your name</label>
        <input id="username" type="text" placeholder="Enter your name" autocomplete="name" />
      </div>

      <div class="form-group">
        <label for="roomName">Room name</label>
        <input id="roomName" type="text" placeholder="Example: test-room1" value="test-room1" />
      </div>

      <div class="button-row">
        <button id="joinBtn" class="btn primary">Join Call</button>
        <button id="leaveBtn" class="btn danger hidden">Leave Call</button>
      </div>

      <div class="status-row">
        <span>Status:</span>
        <strong id="statusText">Not connected</strong>
      </div>

      <button id="micBtn" class="btn mic hidden">Mute Microphone</button>

      <div class="participants-heading">
        <h2>Participants</h2>
        <span id="participantCount">0</span>
      </div>

      <div id="participants" class="participants">
        <div class="empty">No participants yet.</div>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
